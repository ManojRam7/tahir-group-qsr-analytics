name: qsr-analytics-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e .
      - run: ruff check src scripts tests
      - run: ruff format --check src scripts tests
      - run: python scripts/check_publication.py
      - run: pytest -q
      - run: python scripts/generate_synthetic_data.py
      - run: python scripts/run_analysis.py
      - name: Execute teaching notebook
        run: jupyter nbconvert --execute --to notebook --inplace --ExecutePreprocessor.timeout=180 notebooks/01_end_to_end_qsr_analytics.ipynb
  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: portfolio_ci_only
          POSTGRES_DB: qsr_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: qsr_ci
      PGUSER: postgres
      PGPASSWORD: portfolio_ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: python scripts/generate_synthetic_data.py
      - run: python scripts/run_analysis.py
      - run: python scripts/prepare_psql_import.py
      - run: psql -X -v ON_ERROR_STOP=1 -f sql/postgresql/01_schema.sql -f output/postgresql/import_local.psql -f sql/postgresql/02_views.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f sql/postgresql/03_business_questions.sql
      - run: python scripts/validate_postgresql.py
      - run: python scripts/export_dashboard_snapshot.py
